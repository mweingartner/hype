[extend]
useDefault = true

[[allowlists]]
description = "Generated build, app, local-signing, visual-QA, and AI-training outputs"
paths = [
  '''^\.build(?:/|$)''',
  '''^dist(?:/|$)''',
  '''^\.hype-codesign(?:/|$)''',
  '''^\.hype/visual-qa(?:/|$)''',
  '''^scripts/ai-training/out(?:/|$)''',
]

[[allowlists]]
description = "Local git worktrees (background-task checkouts under .claude/worktrees) — gitignored, ephemeral, not repo source; each is a full checkout whose .build cache and other tasks' test fixtures are scanned in their own pipelines, not this one."
paths = [
  '''^\.claude/worktrees(?:/|$)''',
  '''(?:^|/)\.claude/worktrees/''',
]
